# SLF4J Simple Logger Configuration
# This configuration enables file-based logging for tracing tool calls

# Set default log level
org.slf4j.simpleLogger.defaultLogLevel=info

# Enable file logging
org.slf4j.simpleLogger.logFile=data/tool_calls.log

# Set log format with timestamp
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss:SSS

# Show logger name and thread name
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showThreadName=true

# Show short logger name
org.slf4j.simpleLogger.showShortLogName=true

# Set specific log levels for our classes
org.slf4j.simpleLogger.log.com.couchbase.example.cli_agent.EdgeServerTools=debug

# Suppress some noisy third-party logging
org.slf4j.simpleLogger.log.org.apache.http=warn
org.slf4j.simpleLogger.log.com.fasterxml.jackson=warn

# Cache output stream to improve performance
org.slf4j.simpleLogger.cacheOutputStream=false